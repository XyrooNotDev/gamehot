plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.hoteltycoon'
    compileSdk 34
    ndkVersion '26.1.10909125'     // dipasang di CI; Android Studio akan menawarkan mengunduhnya

    defaultConfig {
        applicationId 'com.example.hoteltycoon'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.2'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17' } }
    }
    externalNativeBuild {
        cmake { path file('../CMakeLists.txt'); version '3.22.1' }
    }

    // Penandatanganan release: hanya aktif jika variabel lingkungan keystore diisi (dipakai CI).
    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('KEYSTORE_FILE')) signingConfig signingConfigs.release
        }
    }
}
