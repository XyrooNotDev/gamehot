name: Build Hotel Tycoon

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: 26.1.10909125
  CMAKE_VERSION: 3.22.1
  GRADLE_VERSION: '8.7'

jobs:
  # 1) Tes logika inti di desktop (tanpa GL / Android) dengan sanitizer
  test:
    name: Tes desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurasi
        run: cmake -S . -B build -DHOTEL_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Debug
             -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build --parallel

      - name: Jalankan tes
        run: ctest --test-dir build --output-on-failure

  # 2) APK debug (bisa langsung di-install)
  apk-debug:
    name: APK debug
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK + NDK + CMake
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;${{ env.NDK_VERSION }}
            cmake;${{ env.CMAKE_VERSION }}

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build APK debug
        run: gradle assembleDebug --stacktrace

      - name: Unggah APK debug
        uses: actions/upload-artifact@v4
        with:
          name: HotelTycoon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  # 3) APK release (tag v*): ditandatangani jika secret keystore diisi, jika tidak hasilnya unsigned
  release:
    name: APK release
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK + NDK + CMake
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            platform-tools
            platforms;android-34
            build-tools;34.0.0
            ndk;${{ env.NDK_VERSION }}
            cmake;${{ env.CMAKE_VERSION }}

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # Secret yang dibutuhkan (Settings > Secrets and variables > Actions):
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Siapkan keystore (opsional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "Keystore tidak diisi: APK release tidak ditandatangani."
          fi

      - name: Build APK release
        run: gradle assembleRelease --stacktrace

      - name: Unggah APK release
        uses: actions/upload-artifact@v4
        with:
          name: HotelTycoon-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
